services:
  dotamp-bot:
    build: .
    image: dotamp-bot:latest
    container_name: dotamp-bot
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8097:8097" # web listener, behind pfSense HAProxy as listen.bradycole.com
    volumes:
      - ./config:/config

# Plex lists this subnet as LAN (LanNetworksBandwidth), so it must not change.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/16
