<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>dotamp</title>
<style>
/* One column: what is playing, the button, then what is next. */
:root {
  --bg: #f1f4f2; --panel: #ffffff; --ink: #14201d; --muted: #5d6f6a; --line: #d9e2df;
  --accent: #1f7a6d; --accent-ink: #ffffff; --bar: #dfe8e5; --live: #c0392b;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1517; --panel: #172024; --ink: #e4ece9; --muted: #93a8a2; --line: #26343a;
    --accent: #4cc2ae; --accent-ink: #0b1513; --bar: #24323a; --live: #ff6b5b; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; }
.where { font: 500 0.78rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.off .dot { background: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.by { color: var(--muted); overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.times { display: flex; justify-content: space-between; font: 0.8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
button { font: 600 1rem var(--sans); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer; min-width: 140px; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.vol { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; color: var(--muted); font-size: 0.85rem; }
.vol input { flex: 1; min-width: 0; accent-color: var(--accent); }
.note { font-size: 0.88rem; color: var(--muted); margin: 0; }
h2 { font: 600 0.78rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
li { display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
li:last-child { border-bottom: 0; }
li .n { font: 0.8rem var(--mono); color: var(--muted); padding-top: 2px; }
li .t { min-width: 0; overflow-wrap: anywhere; }
li .who { display: block; font-size: 0.82rem; color: var(--muted); }
.empty { color: var(--muted); font-size: 0.9rem; }
.mine[hidden] { display: none; }
.warn { font-size: 0.82rem; color: var(--muted); margin: 0; }
.search { display: grid; gap: 8px; }
.search input { font: 1rem var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.results:empty { display: none; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .tag { display: block; font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.small { font: 600 0.82rem var(--sans); min-width: 0; padding: 8px 10px; white-space: nowrap; background: transparent; color: var(--accent); border: 1px solid var(--line); }
.small.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status { font-size: 0.88rem; margin: 0; min-height: 1.3em; color: var(--muted); }
.status.bad { color: var(--live); }
</style>
</head>
<body>
<main id="app" data-token="{{.Token}}">
  <div class="where" id="where"><span class="dot"></span><span id="where-text">Connecting…</span></div>

  <section class="card" aria-live="polite">
    <h1 id="title">dotamp</h1>
    <div class="by" id="by">&nbsp;</div>
    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="play" type="button" disabled>Play</button>
      <label class="vol" for="volume">Volume <input id="volume" type="range" min="0" max="100" value="80"></label>
    </div>
    <p class="note" id="note">A few seconds behind Discord. If you're in the voice channel too, mute one.</p>
  </section>

  <section class="card mine" id="mine" hidden>
    <h2>Your songs</h2>
    <p class="warn">This link acts as you. Anyone you share it with can add and remove your songs.</p>
    <div class="search">
      <label for="q" class="note">Add a song, album or playlist</label>
      <input id="q" type="search" autocomplete="off" placeholder="Search the library">
      <ul class="results" id="results"></ul>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <ol id="songs"></ol>
  </section>

  <section class="card">
    <h2>Up next</h2>
    <ol id="next"></ol>
  </section>
  <audio id="audio" preload="none"></audio>
</main>
<script>
(() => {
  const base = location.pathname.replace(/\/+$/, "");
  const $ = id => document.getElementById(id);
  const audio = $("audio"), btn = $("play");
  let now = null, fetchedAt = 0, playing = false;
  const clock = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function render() {
    if (!now) return;
    const live = now.live;
    document.body.classList.toggle("off", !live);
    $("where-text").textContent = live ? "Playing in " + now.channel : "Not playing";
    if (!live) {
      $("title").textContent = "dotamp isn't in a voice channel right now";
      $("by").textContent = "Ask someone to /join it in Discord, then press Play.";
    } else if (now.track) {
      $("title").textContent = now.track.title;
      $("by").textContent = [now.track.artist, now.track.album].filter(Boolean).join(" · ");
    }
    btn.disabled = !live && !playing;
    const ol = $("next");
    ol.replaceChildren();
    (now.upcoming || []).forEach((u, i) => {
      const li = document.createElement("li");
      const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
      const t = document.createElement("span"); t.className = "t"; t.textContent = u.title + (u.artist ? " · " + u.artist : "");
      const who = document.createElement("span"); who.className = "who"; who.textContent = u.by || "radio";
      t.append(who); li.append(n, t); ol.append(li);
    });
    if (!ol.children.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nothing queued. Radio picks the next song."; ol.append(li); }
  }

  function tick() {
    if (!now || !now.track) { $("progress").style.width = "0"; return; }
    const pos = now.position + (Date.now() - fetchedAt) / 1000;
    const dur = now.track.duration || 0;
    $("pos").textContent = clock(Math.min(pos, dur));
    $("dur").textContent = clock(dur);
    $("progress").style.width = dur ? Math.min(100, pos / dur * 100) + "%" : "0";
  }

  async function poll() {
    try {
      const r = await fetch(base + "/now.json", { cache: "no-store" });
      if (r.status === 403) { location.reload(); return; }
      now = await r.json(); fetchedAt = Date.now(); render(); renderMine(); tick();
    } catch (e) { /* the next poll tries again */ }
  }

  function stop(msg) {
    playing = false;
    audio.pause(); audio.removeAttribute("src"); audio.load();
    btn.textContent = "Play";
    if (msg) $("note").textContent = msg;
    render();
  }

  btn.addEventListener("click", () => {
    if (playing) { stop(); return; }
    playing = true;
    btn.textContent = "Stop";
    $("note").textContent = "A few seconds behind Discord. If you're in the voice channel too, mute one.";
    audio.src = base + "/stream.ogg?" + Date.now();
    audio.volume = $("volume").value / 100;
    audio.play().catch(() => stop("Your browser didn't start the audio. Press Play again."));
  });
  $("volume").addEventListener("input", e => { audio.volume = e.target.value / 100; });
  // An <audio> error hides the HTTP status, so ask now.json why.
  audio.addEventListener("error", async () => {
    if (!playing) return;
    await poll();
    if (now && !now.live) stop("dotamp isn't in a voice channel right now. Ask someone to /join it in Discord, then press Play.");
    else if (now && now.full) stop("The web player is full right now (25 listening). Try again in a bit.");
    else stop("The stream stopped. If dotamp is still in Discord, press Play again.");
  });
  audio.addEventListener("ended", () => { if (playing) stop("The stream ended."); });

  // Your songs: the link owner's lane, managed with the same rules as /play and /remove.
  let mineSig = "";
  function say(msg, bad) { const el = $("status"); el.textContent = msg || ""; el.classList.toggle("bad", !!bad); }

  async function send(path, payload) {
    try {
      const r = await fetch(base + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (r.status === 403) { location.reload(); return null; }
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { say(out.error || "That didn't work. Try again.", true); return null; }
      return out;
    } catch (e) { say("Couldn't reach dotamp. Try again.", true); return null; }
  }

  function smallButton(text, go, onClick) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (go ? " go" : ""); b.textContent = text;
    b.addEventListener("click", async () => { b.disabled = true; await onClick(); b.disabled = false; });
    return b;
  }

  function renderMine() {
    if (!now || !now.lanes) return;
    $("mine").hidden = false;
    const sig = JSON.stringify(now.mine);
    if (sig === mineSig) return; // rebuilding under a finger would eat the tap
    mineSig = sig;
    const ol = $("songs");
    ol.replaceChildren();
    now.mine.forEach((s, k) => {
      const li = document.createElement("li");
      li.className = "row";
      const t = document.createElement("span"); t.className = "t";
      t.textContent = s.title + (s.artist ? " · " + s.artist : "");
      if (s.next) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "Lined up for your next turn"; t.prepend(tag); }
      li.append(t);
      if (k > 0) li.append(smallButton("Play next", false, async () => {
        if (await send("/top", { k, id: s.id })) { say("Moved " + s.title + " to the top"); await poll(); }
      }));
      li.append(smallButton("Remove", false, async () => {
        if (await send("/remove", { k, id: s.id })) { say("Removed " + s.title); await poll(); }
      }));
      ol.append(li);
    });
    if (!now.mine.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "You have nothing waiting. Search above to add something."; ol.append(li); }
  }

  let searchTimer = 0, searchSeq = 0;
  $("q").addEventListener("input", e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if (q.length < 2) { $("results").replaceChildren(); return; }
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      try {
        const r = await fetch(base + "/search?q=" + encodeURIComponent(q), { cache: "no-store" });
        if (r.status === 403) { location.reload(); return; }
        const cs = await r.json();
        if (seq !== searchSeq) return; // a newer search is on its way
        const ul = $("results");
        ul.replaceChildren();
        cs.forEach(c => {
          const li = document.createElement("li"); li.className = "row";
          const t = document.createElement("span"); t.className = "t"; t.textContent = c.label;
          li.append(t, smallButton("Add", true, async () => {
            const out = await send("/add", { value: c.value });
            if (out) { say(out.message); $("q").value = ""; ul.replaceChildren(); await poll(); }
          }));
          ul.append(li);
        });
        if (!cs.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nothing found"; ul.append(li); }
      } catch (e) { /* the next keystroke tries again */ }
    }, 300);
  });

  poll(); setInterval(poll, 5000); setInterval(tick, 1000);
})();
</script>
</body>
</html>
